<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ 9H 16Min Countdown Timer V.30 - Mukesh Kumar || ADSL ⭐</title>

<style>
body {
    font-family: Segoe UI, Trebuchet MS;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 10px;
}

.box {
    max-width: 500px;
    margin: auto;
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
}

.title {
    text-align: center;
    font-size: 20px;
    color: #60a5fa;
    font-weight: bold;
}

#clock { text-align:center; margin:10px; }

input, button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-top: 6px;
    border-radius: 6px;
    border: none;
}

button { background: #3b82f6; color: white; }
button:disabled { background: #64748b; }

.timer {
    text-align: center;
    font-size: 24px;
    margin-top: 10px;
}

.progress {
    height: 25px;
    background: #334155;
    margin-top: 10px;
    border-radius: 6px;
}

.bar {
    height: 100%;
    width: 0%;
    background: #22c55e;
    border-radius: 6px;
}

table {
    width: 100%;
    margin-top: 15px;
    font-size: 12px;
    border-collapse: collapse;
}

th, td {
    border-bottom: 1px solid #444;
    padding: 6px;
    text-align: center;
}

th { color: #60a5fa; }

body.light { background: #f8fafc; color: black; }
body.light .box { background:white; }
</style>

<script>
let TargetHours = 9, TargetMinutes = 16;

let startTime, targetTime;
let timerID, clockID;
let isPaused = false, totalDuration = 0;

// ===== STORAGE =====
function saveRecord(login, logout) {
    let records = JSON.parse(localStorage.getItem("timerRecords") || "[]");

    records.push({
        date: new Date().toLocaleDateString(),
        login,
        logout
    });

    if (records.length > 7) records.shift();

    localStorage.setItem("timerRecords", JSON.stringify(records));
    loadRecords();
}

function loadRecords() {
    let records = JSON.parse(localStorage.getItem("timerRecords") || "[]");
    let table = document.getElementById("history");

    table.innerHTML = "";

    records.slice().reverse().forEach(r => {
        table.innerHTML += `
        <tr>
            <td>${r.date}</td>
            <td>${r.login}</td>
            <td>${r.logout}</td>
        </tr>`;
    });
}

// ===== TIMER =====
function startTimer() {
    let t = starttime.value;

    if (!t || !t.includes(":")) {
        alert("Enter HH:MM format");
        return;
    }

    let [h,m] = t.split(":").map(Number);

    let now = new Date();
    startTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);

    if (startTime > now) startTime.setDate(startTime.getDate()-1);

    targetTime = new Date(startTime);
    targetTime.setHours(targetTime.getHours()+TargetHours);
    targetTime.setMinutes(targetTime.getMinutes()+TargetMinutes);

    login.innerText = t;
    logout.innerText = targetTime.toLocaleTimeString();

    totalDuration = (targetTime - startTime)/1000;

    clearInterval(timerID);
    timerID = setInterval(updateTimer,1000);

    clearInterval(clockID);
    clockID = setInterval(updateClock,1000);

    isPaused = false;

    btnStart.disabled = true;
    btnPause.disabled = false;
    btnResume.disabled = true;
}

function updateTimer() {
    if (isPaused) return;

    let remaining = (targetTime - new Date())/1000;

    if (remaining <= 0) {
        saveRecord(login.innerText, logout.innerText);

        remainingDiv.innerHTML = "<span style='color:red'>COMPLETED</span>";
        progressbar.style.width = "100%";

        clearInterval(timerID);

        alert("Shift Completed");
        speak("Countdown completed");

        btnStart.disabled = false;
        return;
    }

    let h = Math.floor(remaining/3600);
    let m = Math.floor((remaining%3600)/60);
    let s = Math.floor(remaining%60);

    remainingDiv.innerText = `${h}h ${m}m ${s}s`;

    let percent = ((totalDuration-remaining)/totalDuration)*100;
    progressbar.style.width = percent + "%";
}

// ===== CLOCK =====
function updateClock() {
    clock.innerText = "Current Time: " + new Date().toLocaleTimeString();
}

// ===== CONTROLS =====
function pauseTimer(){
    isPaused = true;
    btnPause.disabled = true;
    btnResume.disabled = false;
}

function resumeTimer(){
    isPaused = false;
    btnPause.disabled = false;
    btnResume.disabled = true;
}

function resetTimer(){
    clearInterval(timerID);

    isPaused = false;

    starttime.value = "";
    login.innerText = "--";
    logout.innerText = "--";
    remainingDiv.innerText = "--";
    progressbar.style.width = "0%";

    btnStart.disabled = false;
    btnPause.disabled = true;
    btnResume.disabled = true;

    alert("Timer reset. Start fresh.");
}

function fillCurrentTime(){
    let d=new Date();
    starttime.value =
        d.getHours().toString().padStart(2,'0')+":"+
        d.getMinutes().toString().padStart(2,'0');
}

function toggleTheme(){
    document.body.classList.toggle("light");
}

// ===== VOICE =====
function speak(text){
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

// ===== INIT =====
window.onload = function(){
    updateClock();
    clockID = setInterval(updateClock,1000);
    loadRecords();
};
</script>

</head>

<body>

<div class="box">

<div class="title">⭐ 9H 16Min Countdown Timer V.30 - Mukesh Kumar || ADSL ⭐</div>

<div id="clock"></div>

<b>Enter Start Time (HH:MM)</b>
<input id="starttime" placeholder="Enter time HH:MM" >

<button onclick="fillCurrentTime()">Fill Current Time</button>

<button id="btnStart" onclick="startTimer()">Start</button>
<button id="btnPause" onclick="pauseTimer()" disabled>Pause</button>
<button id="btnResume" onclick="resumeTimer()" disabled>Resume</button>
<button onclick="resetTimer()">🔄 Reset</button>
<button onclick="toggleTheme()">Toggle Theme</button>

<br><br>

<b>Login:</b> <span id="login">--</span><br>
<b>Logout:</b> <span id="logout">--</span>

<div class="timer" id="remainingDiv">--</div>

<div class="progress">
<div class="bar" id="progressbar"></div>
</div>

<h3>Last 7 Days Record</h3>

<table>
<tr><th>Date</th><th>Login</th><th>Logout</th></tr>
<tbody id="history"></tbody>
</table>

</div>
<br>

<div style="font-size:12px; text-align:center;">
Designed for our team, so they don’t need to manually calculate the 9 hours 15 minutes (Added 1 min extra for buffer) required for logout. - Mukesh Kumar.
</div>

</div>

</body>
</html>
